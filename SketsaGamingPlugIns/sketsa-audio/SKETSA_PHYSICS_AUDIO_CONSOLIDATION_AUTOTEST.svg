<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"
 data-sketsa-audio-master-volume="0.8" data-sketsa-audio-master-mute="false"
 data-sketsa-audio-bus-sfx-volume="1" data-sketsa-audio-bus-sfx-mute="false"
 data-sketsa-physics-gravity-x="0" data-sketsa-physics-gravity-y="1" data-sketsa-physics-gravity-scale="0.001" data-sketsa-physics-time-scale="1" data-sketsa-physics-enable-sleeping="true">
  <rect width="1000" height="650" fill="#f7f7f7"/>
  <text x="40" y="48" font-family="sans-serif" font-size="25" font-weight="bold">Sketsa Physics + Audio — Combined Runtime Consolidation</text>
  <text x="40" y="78" font-family="sans-serif" font-size="14">Export from Audio with “Include companion runtimes” enabled.</text>
  <text id="combined-status" x="40" y="108" font-family="monospace" font-size="14">AUTOTEST: waiting for Physics + Audio runtimes…</text>

  <circle id="impact-ball" cx="320" cy="185" r="30" fill="#5b9bd5" stroke="#24557d" stroke-width="2"
    data-sketsa-physics-body="dynamic" data-sketsa-physics-shape="circle"
    data-sketsa-physics-density="0.001" data-sketsa-physics-mass="0"
    data-sketsa-physics-friction="0.1" data-sketsa-physics-friction-static="0.5" data-sketsa-physics-friction-air="0.002"
    data-sketsa-physics-restitution="0.25" data-sketsa-physics-angle="0" data-sketsa-physics-velocity-x="0" data-sketsa-physics-velocity-y="0"
    data-sketsa-physics-angular-velocity="0" data-sketsa-physics-sensor="false" data-sketsa-physics-force-x="0" data-sketsa-physics-force-y="0"
    data-sketsa-physics-impulse-x="0" data-sketsa-physics-impulse-y="0" data-sketsa-physics-torque="0" data-sketsa-physics-sleeping="false"
    data-sketsa-physics-constraint="none" data-sketsa-physics-collision-category="1" data-sketsa-physics-collision-mask="4294967295" data-sketsa-physics-collision-group="0"
    data-sketsa-physics-event-start="true" data-sketsa-physics-event-active="false" data-sketsa-physics-event-end="false" data-sketsa-physics-event-id="impact"/>

  <rect id="impact-floor" x="170" y="390" width="300" height="24" fill="#555"
    data-sketsa-physics-body="static" data-sketsa-physics-shape="rectangle"
    data-sketsa-physics-density="0.001" data-sketsa-physics-mass="0"
    data-sketsa-physics-friction="0.5" data-sketsa-physics-friction-static="0.8" data-sketsa-physics-friction-air="0.01"
    data-sketsa-physics-restitution="0.1" data-sketsa-physics-angle="0" data-sketsa-physics-velocity-x="0" data-sketsa-physics-velocity-y="0"
    data-sketsa-physics-angular-velocity="0" data-sketsa-physics-sensor="false" data-sketsa-physics-force-x="0" data-sketsa-physics-force-y="0"
    data-sketsa-physics-impulse-x="0" data-sketsa-physics-impulse-y="0" data-sketsa-physics-torque="0" data-sketsa-physics-sleeping="false"
    data-sketsa-physics-constraint="none" data-sketsa-physics-collision-category="1" data-sketsa-physics-collision-mask="4294967295" data-sketsa-physics-collision-group="0"
    data-sketsa-physics-event-start="false" data-sketsa-physics-event-active="false" data-sketsa-physics-event-end="false" data-sketsa-physics-event-id=""/>

  <rect id="impact-sound" x="600" y="180" width="260" height="120" rx="14" fill="#dff4df" stroke="#4d8a54" stroke-width="2"
    data-sketsa-audio-src="data:audio/wav;base64," data-sketsa-audio-autoplay="false" data-sketsa-audio-loop="false"
    data-sketsa-audio-volume="0.55" data-sketsa-audio-playback-rate="1" data-sketsa-audio-start-offset="0"
    data-sketsa-audio-event-id="impact-sound" data-sketsa-audio-mute="false" data-sketsa-audio-pan="0" data-sketsa-audio-pan-mode="manual" data-sketsa-audio-bus="sfx"
    data-sketsa-audio-trigger-source="physics" data-sketsa-audio-trigger-type="collisionStart" data-sketsa-audio-trigger-event-id="impact" data-sketsa-audio-trigger-action="play"/>
  <text x="642" y="235" font-family="sans-serif" font-size="18" font-weight="bold">IMPACT SOUND</text>
  <text x="625" y="266" font-family="sans-serif" font-size="13">collisionStart → play</text>

  <rect x="80" y="470" width="840" height="130" rx="12" fill="#fff" stroke="#ccc"/>
  <text x="105" y="505" font-family="sans-serif" font-size="16" font-weight="bold">PASS verifies only already introduced features:</text>
  <text x="105" y="535" font-family="sans-serif" font-size="13">• Physics and Audio APIs are both present in the same exported HTML</text>
  <text x="105" y="560" font-family="sans-serif" font-size="13">• real Physics collisionStart is mirrored to sketsa:runtime:event and consumed by Audio</text>
  <text x="105" y="585" font-family="sans-serif" font-size="13">• Audio action/play succeeds; Matter, Physics runtime and Audio assets are local</text>

  <script><![CDATA[
  (function(){
    var state={physics:false,audio:false,neutral:false,action:false,play:false,local:false,meta:false};
    function status(){
      var el=document.getElementById('combined-status'); if(!el)return;
      state.physics=!!window.SketsaPhysics;
      state.audio=!!window.SketsaAudio;
      var scripts=[].slice.call(document.scripts||[]).map(function(s){return s.src||'';}).filter(Boolean);
      state.local=scripts.length>=4 && scripts.every(function(u){return !/^https?:/i.test(u);});
      state.meta=!!document.querySelector('meta[name="sketsa-physics-runtime"]') && !!document.querySelector('meta[name="sketsa-audio-runtime"]');
      var ok=state.physics&&state.audio&&state.neutral&&state.action&&state.play&&state.local&&state.meta;
      el.textContent=(ok?'AUTOTEST PASS: ':'AUTOTEST: ')+'physics='+state.physics+', audio='+state.audio+', neutral='+state.neutral+', action='+state.action+', play='+state.play+', local='+state.local+', meta='+state.meta;
      el.setAttribute('fill',ok?'#187a32':'#8a5a00');
    }
    document.addEventListener('sketsa:runtime:event',function(e){var d=e.detail||{};if(d.source==='physics'&&d.type==='collisionStart'&&d.data&&d.data.eventId==='impact'){state.neutral=true;status();}});
    document.addEventListener('sketsa:audio:actionResult',function(e){var d=e.detail||{};if(d.ok&&d.action==='play'){state.action=true;status();}});
    document.addEventListener('sketsa:audio:event',function(e){var d=e.detail||{};if(d.type==='play'){state.play=true;status();}});
    var timer=setInterval(function(){status();if(state.physics&&state.audio&&state.neutral&&state.action&&state.play&&state.local&&state.meta)clearInterval(timer);},100);
    setTimeout(status,50);
  })();
  ]]></script>
</svg>