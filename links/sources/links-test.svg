<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="720" height="300" viewBox="0 0 720 300">
  <rect width="720" height="300" fill="white"/>
  <text id="text1" x="40" y="70" font-family="sans-serif" font-size="28">Select this text and create a link</text>
  <rect id="box1" x="40" y="110" width="180" height="70" rx="10" fill="#dddddd" stroke="#444444"/>
  <a id="existingLink" href="https://example.com" xlink:href="https://example.com" target="_blank" title="Existing example">
    <circle id="linkedCircle" cx="400" cy="145" r="45" fill="#bbbbbb" stroke="#333333"/>
  </a>
  <text x="340" y="230" font-family="sans-serif" font-size="16">Circle already linked</text>
</svg>
