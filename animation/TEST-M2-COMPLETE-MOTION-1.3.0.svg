<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="760" height="460" viewBox="0 0 760 460">
  <rect width="760" height="460" fill="#f5f5f5"/>

  <!-- Referenced path exercises C/S/Q/T/A and relative commands. -->
  <path id="route"
        d="M70 110 C130 25 205 25 255 110 S380 195 430 110 Q490 25 545 110 T660 110 A55 55 0 0 1 605 165 a55 35 25 0 1 -90 35"
        fill="none" stroke="#90a4ae" stroke-width="2"/>

  <g transform="scale(1.15)">
    <circle r="11" fill="#e53935">
      <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
        <mpath href="#route" xlink:href="#route"/>
      </animateMotion>
    </circle>
  </g>

  <!-- Inline Motion: H/V/L + C/S + Q/T + A/a, auto-reverse. -->
  <rect x="-10" y="-7" width="20" height="14" fill="#1e88e5">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto-reverse"
      path="M80 310 h90 v-55 l70 0 c45 0 45 80 90 80 s45 -80 90 -80 q45 0 65 45 t65 0 A55 35 20 0 1 655 315 a45 30 -20 0 1 -70 45"/>
  </rect>

  <!-- Fixed angle and static transform composition. -->
  <path d="M-14 -8 L14 -8 L0 -30 Z" fill="#43a047"
        transform="translate(0,0) scale(0.9)">
    <animateMotion dur="5s" repeatCount="indefinite" rotate="30"
      path="M80 400 C220 340 360 440 520 380 S650 370 700 400"/>
  </path>
</svg>
